<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MAHMOUD MOHAMED</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #7fd0a0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    
  .brand-mark {
    display: grid; place-items: center;
    width: 42px; height: 42px; margin: 0 auto 9px;
    border-radius: 50%; border: 1px solid rgba(255,48,79,.7);
    background: linear-gradient(135deg, rgba(255,48,79,.2), rgba(108,246,255,.08));
    color: #fff; font-weight: 900; font-size: 21px;
    box-shadow: 0 0 22px rgba(255,48,79,.25), 0 0 42px rgba(108,246,255,.1);
  }

      /* Neon gaming / digital-art theme — visual only; runtime behavior stays intact. */
      :root {
        color-scheme: dark;
        --neon-red: #ff304f;
        --neon-cyan: #6cf6ff;
        --ink: #07070b;
        --panel: rgba(15, 15, 25, .94);
        --line: rgba(255, 48, 79, .32);
      }
      html { min-height: 100%; background: var(--ink); }
      body {
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 14% 12%, rgba(255,48,79,.16), transparent 38%),
          radial-gradient(ellipse at 88% 48%, rgba(108,246,255,.08), transparent 35%),
          linear-gradient(145deg, #07070b 0%, #0c0b14 54%, #050508 100%);
        color: #f7f7fb;
        font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: .12;
        background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
        background-size: 38px 38px;
        mask-image: linear-gradient(to bottom, #000, transparent 88%);
      }
      #brand, #wrap { position: relative; z-index: 1; }
      #brand {
        padding: 18px 14px;
        background: rgba(8,8,14,.88);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 8px 45px rgba(0,0,0,.28);
      }
      #brand::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 20%;
        width: 60%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--neon-red), var(--neon-cyan), transparent);
      }
      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 38px;
        margin: 0 10px 0 0;
        vertical-align: middle;
        border: 1px solid rgba(255,48,79,.7);
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255,48,79,.2), rgba(108,246,255,.08));
        color: #fff;
        font-size: 19px;
        font-weight: 900;
        box-shadow: 0 0 22px rgba(255,48,79,.24), 0 0 42px rgba(108,246,255,.1);
      }
      #brand b {
        color: #fff;
        font-size: clamp(14px, 3.5vw, 18px);
        font-weight: 900;
        letter-spacing: .09em;
        text-shadow: 0 0 18px rgba(255,48,79,.4);
      }
      #spin {
        z-index: 2;
        border-color: rgba(255,255,255,.1);
        border-top-color: var(--neon-red);
        border-right-color: var(--neon-cyan);
        filter: drop-shadow(0 0 9px rgba(255,48,79,.42));
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        animation: spin 1s linear infinite, pulse-glow 2s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(255,48,79,.28)); }
        50% { filter: drop-shadow(0 0 15px rgba(108,246,255,.4)); }
      }
      #msg {
        z-index: 2;
        padding: 24px;
        color: #f7f7fb;
        font-weight: 800;
        letter-spacing: .04em;
        text-shadow: 0 0 18px rgba(255,48,79,.2);
      }
      body.done #msg {
        color: #fff;
        text-shadow: 0 0 18px rgba(46, 204, 113, .28);
        letter-spacing: 0;
      }
      .success-check {
        display: none; width: 58px; height: 58px; margin: 0 auto 14px;
        align-items: center; justify-content: center; border-radius: 50%;
        border: 3px solid #2ecc71; background: rgba(46, 204, 113, .13);
        color: #2ecc71; font: 900 34px/1 "Segoe UI", system-ui, sans-serif;
        box-shadow: 0 0 22px rgba(46, 204, 113, .32), inset 0 0 14px rgba(46, 204, 113, .08);
        animation: success-pop .35s ease-out both;
      }
      body.done .success-check { display: flex; }
      @keyframes success-pop {
        from { transform: scale(.55); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      body[dir="rtl"] #brand b { letter-spacing: .03em; }
      body.log #out { direction: ltr; text-align: left; }
      body.log #state { direction: rtl; text-align: right; }
      body.fail #msg { color: #ff526b; }
      body.log #wrap {
        width: min(100% - 28px, 1000px);
        margin: 24px auto;
        padding: clamp(14px, 3vw, 24px);
        border: 1px solid var(--line);
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(20,20,31,.95), rgba(8,8,15,.97));
        box-shadow: 0 22px 75px rgba(0,0,0,.38), 0 0 34px rgba(255,48,79,.07);
        backdrop-filter: blur(12px);
      }
      body.log #state {
        color: #fff;
        text-shadow: 0 0 16px rgba(255,48,79,.22);
        overflow-wrap: anywhere;
      }
      body.log #out {
        max-width: 100%;
        height: calc(100vh - 155px);
        min-height: 220px;
        background: rgba(3,3,8,.8);
        border: 1px solid rgba(108,246,255,.18);
        border-radius: 12px;
        padding: 14px;
        color: #dfe6f2;
        overflow-wrap: anywhere;
        scrollbar-color: var(--neon-red) #101018;
      }
      .ok, .safe { color: var(--neon-cyan); }
      .bad, .danger { color: #ff526b; }
      .warn { color: #ffd166; }
      code { color: #9deeff; }
      @media (max-width: 520px) {
        #brand { padding: 14px 10px; }
        .brand-mark { width: 32px; height: 32px; font-size: 16px; margin-right: 7px; }
        #brand b { letter-spacing: .04em; }
        body.log #wrap { width: calc(100% - 18px); margin: 12px auto; padding: 12px; }
        body.log #out { height: calc(100vh - 135px); font-size: 11px; padding: 10px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #spin { animation: spin 2s linear infinite; }
      }

      var logoMark = document.querySelector(".brand-mark");
      var logoSymbols = { red:"M", blue:"◇", purple:"✦", green:"ϟ", ironman:"I", spiderman:"S", captain:"★", hulk:"H", thor:"⚡", panther:"P" };
      var initialTheme = localStorage.getItem("mahmoud-theme") || "red";
      if (logoMark) logoMark.textContent = logoSymbols[initialTheme] || "M";

      /* Static neon styling: disable moving glow and pulsing effects */
      #brand b, #brand::after, #system-clock, #spin, #music-player,
      .clock-item strong, .success-check {
        animation: none !important;
      }
      #brand::after { opacity: 1 !important; }


  /* Liquid Glass finish for site icons and icon controls */
  .brand-mark, .feature-icon, .clock-symbol, #theme-menu-toggle,
  #theme-menu-close, .theme-swatch, .success-check {
    position:relative;
    overflow:hidden;
    isolation:isolate;
    -webkit-backdrop-filter:blur(16px) saturate(165%);
    backdrop-filter:blur(16px) saturate(165%);
    border:1px solid rgba(255,255,255,.27);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.42),
               inset 0 -1px 1px rgba(255,255,255,.07),
               0 7px 18px rgba(0,0,0,.2),
               0 0 18px color-mix(in srgb,var(--theme-accent,var(--neon-red,#ff304f)) 18%,transparent);
  }
  .brand-mark::after, .feature-icon::after, .clock-symbol::after,
  #theme-menu-toggle::after, #theme-menu-close::after, .theme-swatch::after,
  .success-check::after {
    content:"";
    position:absolute;
    inset:1px 1px auto;
    height:48%;

  .feature-icon, .clock-symbol, #theme-menu-toggle, #theme-menu-close,

  @supports not ((backdrop-filter:blur(1px))) {

  /* Manual Digital Art background picker — visual only */
  #background-menu-toggle {
    position:fixed; left:16px; bottom:16px; z-index:30;
    display:grid; place-items:center; width:48px; height:48px;
    border:1px solid rgba(255,255,255,.28); border-radius:16px;
    color:#fff; font-size:22px; cursor:pointer;
    background:linear-gradient(145deg,rgba(255,255,255,.19),rgba(255,255,255,.055));
    -webkit-backdrop-filter:blur(18px) saturate(170%);
    backdrop-filter:blur(18px) saturate(170%);
    box-shadow:inset 0 1px rgba(255,255,255,.42),0 8px 24px rgba(0,0,0,.35),0 0 22px color-mix(in srgb,var(--theme-accent,var(--neon-red,#ff304f)) 22%,transparent);
  }
  #background-menu-toggle:focus-visible { outline:2px solid var(--theme-accent,#ff304f); outline-offset:3px; }

    background:linear-gradient(145deg,rgba(23,25,40,.88),rgba(7,8,17,.91));

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("mahmoud-theme") || "red";
          if (["red","blue","purple","green","ironman","spiderman","captain","hulk","thor","panther"].indexOf(theme) !== -1) {
            document.documentElement.setAttribute("data-theme", theme);
            document.addEventListener("DOMContentLoaded", function () {
              document.body.setAttribute("data-theme", theme);
            });
          }
        } catch (e) {}
      })();
    </script>

          timeEl.textContent = new Intl.DateTimeFormat("ar-EG", {
            hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
          }).format(now);
          dateEl.textContent = new Intl.DateTimeFormat("ar-EG", {
            weekday: "long", day: "numeric", month: "long", year: "numeric"
          }).format(now);
        }
        updateSystemClock();

<script>
(function () {
  var allowed = ["digital","cosmic","energy","matrix","void"];
  var body = document.body;
  var toggle = document.getElementById("background-menu-toggle");
  var close = document.getElementById("background-menu-close");
  var overlay = document.getElementById("background-overlay");
  var selected = "digital";
  try {
    var saved = localStorage.getItem("mahmoud-background");
    if (allowed.indexOf(saved) !== -1) selected = saved;
  } catch (e) {}
  function applyBackground(name) {
    if (allowed.indexOf(name) === -1) return;
    selected = name;
    body.setAttribute("data-background", name);
    document.querySelectorAll("[data-pick-background]").forEach(function (button) {
      button.setAttribute("aria-pressed", button.getAttribute("data-pick-background") === name ? "true" : "false");
    });
    try { localStorage.setItem("mahmoud-background", name); } catch (e) {}
  }
  function openMenu() { body.classList.add("background-menu-open"); toggle.setAttribute("aria-expanded","true"); }
  function closeMenu() { body.classList.remove("background-menu-open"); toggle.setAttribute("aria-expanded","false"); }
  applyBackground(selected);
  toggle.addEventListener("click", function () { body.classList.contains("background-menu-open") ? closeMenu() : openMenu(); });
  close.addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);
  document.addEventListener("keydown", function (event) { if (event.key === "Escape") closeMenu(); });
  document.querySelectorAll("[data-pick-background]").forEach(function (button) {
    button.addEventListener("click", function () { applyBackground(button.getAttribute("data-pick-background")); });
  });
})();
</script>

}
#page-shake-button:active { transform:scale(.97); }

@keyframes mmPageShake {
  0%,100% { transform:translate3d(0,0,0); }
  10%,50%,90% { transform:translate3d(-5px,0,0); }
  20%,60% { transform:translate3d(5px,0,0); }
  30%,70% { transform:translate3d(-4px,0,0); }
  40%,80% { transform:translate3d(4px,0,0); }
}
html.mm-page-shaking body { animation:mmPageShake .16s linear infinite; }

<button id="page-shake-button" type="button" aria-label="اهتزاز الصفحة لمدة ثانية">📳 اهتزاز الصفحة</button>
<script>
(function () {
  var button = document.getElementById("page-shake-button");
  if (!button) return;
  var timer;
  button.addEventListener("click", function () {
    var root = document.documentElement;
    root.classList.remove("mm-page-shaking");
    void root.offsetWidth;
    root.classList.add("mm-page-shaking");
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(function () {
      root.classList.remove("mm-page-shaking");
      timer = null;
    }, 1000);
    // Device vibration is optional and unsupported on some browsers, including iOS Safari.
    if (navigator.vibrate) navigator.vibrate(250);
  });
})();
</script>
